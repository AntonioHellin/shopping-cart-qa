openapi: 3.0.0
info:
  title: Shopping Cart API
  version: 1.0.0

paths:
  /api/cart:
    post:
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  type: string
                  example: "prod-abc123"
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
                  example: 2
      responses:
        '200':
          description: Item added successfully
        '400':
          description: Invalid input (quantity out of range)
        '401':
          description: Authentication required
